services:
  my-app:
    build:
      context: .
      dockerfile: my-app/Dockerfile
    env_file:
      - ./.certs/https.env
    ports:
      - "80:8080"
      - "443:443"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_HTTPS_PORTS: "443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/mysite.com.pfx
    volumes:
      - ./.certs/mysite.com.pfx:/https/mysite.com.pfx:ro
